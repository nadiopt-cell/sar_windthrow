[pytest]
# Sentinel-1 windthrow plugin unit tests (v1.3.0 refactor, spec §6.2).
# Run from the repo root with a bare `pytest` or from qgis_plugin/ —
# both resolve via testpaths/pythonpath here.  tests/conftest.py also
# patches sys.path, so `python -m pytest sentinel1_windthrow_plugin/tests`
# keeps working from qgis_plugin/ as before.
testpaths = sentinel1_windthrow_plugin/tests
pythonpath = .
addopts = -q --tb=short
